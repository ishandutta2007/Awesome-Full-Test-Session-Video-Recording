STEM</text></g><text x="0" y="150" fill="url(#primaryGrad)" class="title-text" filter="url(#softGlow)" text-anchor="middle" transform="translate(600, 0)">Full Test Session Video Recording</text><text x="0" y="195" class="sub-text" text-anchor="middle" transform="translate(600, 0)">Curated open-source recorders, async video messaging &amp; self-hosted capture infrastructure</text><g><g transform="translate(600, 0) translate(0, 245) translate(-370, 0)"><rect width="220" height="42" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="21"/><text x="110" y="26" fill="#f8fafc" class="pill-text" text-anchor="middle">⚡ Open Source Recorders</text></g><g transform="translate(600, 0) translate(0, 245) translate(-125, 0)"><rect width="250" height="42" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="21"/><text x="125" y="26" fill="#f8fafc" class="pill-text" text-anchor="middle">🎯 QA &amp; Test Session Capture</text></g><g transform="translate(600, 0) translate(0, 245) translate(150, 0)"><rect width="220" height="42" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="21"/><text x="110" y="26" fill="#f8fafc" class="pill-text" text-anchor="middle">🚀 SaaS &amp; Async Sharing</text></g></g><g><path fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" d="M 0 10 Q 50 0, 100 10 T 200 10 T 300 10 T 400 10 T 500 10" opacity=".7" transform="translate(600, 0) translate(-250, 325)"><animate attributeName="d" dur="4s" repeatCount="indefinite" values="M 0 10 Q 50 0, 100 10 T 200 10 T 300 10 T 400 10 T 500 10; M 0 10 Q 50 20, 100 10 T 200 10 T 300 10 T 400 10 T 500 10; M 0 10 Q 50 0, 100 10 T 200 10 T 300 10 T 400 10 T 500 10"/></path></g></g></svg>