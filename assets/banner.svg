<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Filter for Glow Effects -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -1px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 12px;
      fill: #a5b4fc;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Texture -->
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#blurFilter)">
    <circle cx="200" cy="100" r="140" fill="url(#glowGrad1)">
      <animate attributeName="cx" values="180;240;180" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;130;80" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="280" r="160" fill="url(#glowGrad2)">
      <animate attributeName="cx" values="1020;960;1020" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="260;310;260" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="350" r="100" fill="#3b82f6" opacity="0.15">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Floating Particle Rays in Background -->
  <g opacity="0.6">
    <circle cx="150" cy="220" r="3" fill="#818cf8">
      <animate attributeName="cy" values="220;200;220" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="90" r="2.5" fill="#f472b6">
      <animate attributeName="cy" values="90;70;90" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="110" r="3" fill="#a78bfa">
      <animate attributeName="cy" values="110;130;110" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="180" r="2.5" fill="#38bdf8">
      <animate attributeName="cy" values="180;160;180" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content Container (Completely unobstructed) -->
  <g transform="translate(600, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 65)">
      <rect x="-165" y="0" width="330" height="30" rx="15" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <!-- Recording Pulse Dot -->
      <circle cx="-140" cy="15" r="5" fill="#ef4444">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="5" y="20" text-anchor="middle" class="tag-text">QA &amp; ASYNC VIDEO ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="0" y="150" text-anchor="middle" class="title-text" fill="url(#primaryGrad)" filter="url(#softGlow)">
      Full Test Session Video Recording
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" text-anchor="middle" class="sub-text">
      Curated open-source recorders, async video messaging &amp; self-hosted capture infrastructure
    </text>

    <!-- Feature Badges / Highlights -->
    <g transform="translate(0, 245)">
      <!-- Item 1: Open Source & Self-Hosted -->
      <g transform="translate(-370, 0)">
        <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="110" y="26" text-anchor="middle" fill="#f8fafc" class="pill-text">⚡ Open Source Recorders</text>
      </g>
      <!-- Item 2: QA & Bug Evidence -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="250" height="42" rx="21" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="125" y="26" text-anchor="middle" fill="#f8fafc" class="pill-text">🎯 QA &amp; Test Session Capture</text>
      </g>
      <!-- Item 3: Async Video & SaaS -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="110" y="26" text-anchor="middle" fill="#f8fafc" class="pill-text">🚀 SaaS &amp; Async Sharing</text>
      </g>
    </g>

    <!-- Animated Status Waveform Line -->
    <g transform="translate(-250, 325)">
      <path d="M 0 10 Q 50 0, 100 10 T 200 10 T 300 10 T 400 10 T 500 10" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.7">
        <animate attributeName="d" 
                 values="M 0 10 Q 50 0, 100 10 T 200 10 T 300 10 T 400 10 T 500 10;
                         M 0 10 Q 50 20, 100 10 T 200 10 T 300 10 T 400 10 T 500 10;
                         M 0 10 Q 50 0, 100 10 T 200 10 T 300 10 T 400 10 T 500 10" 
                 dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
